name: D1 Backup

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    if: ${{ vars.D1_DATABASE_NAME != '' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
      R2_BACKUP_BUCKET: ${{ vars.R2_BACKUP_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify backup table list
        run: |
          set -euo pipefail
          pnpm exec wrangler d1 execute "$D1_DATABASE_NAME" --remote --json \
            --command "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name" > /tmp/d1-tables.json
          node scripts/check-backup-tables.mjs /tmp/d1-tables.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Export D1
        run: |
          set -euo pipefail
          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          TABLES=(
            user session account verification rateLimit rate_limits
            categories category_moderators tags topic_tags nav_items
            topics posts post_revisions post_likes bookmarks
            reports notifications notification_preferences
            email_unsubscribe_tokens email_logs email_suppressions
            dev_email_outbox audit_logs settings
          )
          ARGS=()
          for table in "${TABLES[@]}"; do ARGS+=(--table "$table"); done
          pnpm exec wrangler d1 export "$D1_DATABASE_NAME" --remote --no-schema "${ARGS[@]}" --output "backup-${STAMP}.sql"
          gzip -9 "backup-${STAMP}.sql"
          sha256sum "backup-${STAMP}.sql.gz" > "backup-${STAMP}.sql.gz.sha256"
          echo "STAMP=${STAMP}" >> "$GITHUB_ENV"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Upload to R2 backup bucket
        run: |
          set -euo pipefail
          pnpm exec wrangler r2 object put "${R2_BACKUP_BUCKET}/d1/backup-${STAMP}.sql.gz" \
            --file "backup-${STAMP}.sql.gz" --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
