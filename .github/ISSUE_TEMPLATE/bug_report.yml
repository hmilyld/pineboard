name: Bug report
description: Report a reproducible defect in Pineboard
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets, tokens, `.dev.vars` contents, production URLs or user data.
        Security issues go through GitHub Security Advisories, not this form.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The actual behaviour, with the exact page or API path.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in as ...
        2. Open /c/...
        3. Submit ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `node -p "require('./package.json').version"`, or the `version` field from `/api/health`.
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Local development (`pnpm dev`)
        - Deployed Cloudflare Worker
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact secrets, cookies, emails and IP addresses.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I removed secrets and personal data from this report.
          required: true
